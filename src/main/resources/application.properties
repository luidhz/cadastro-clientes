spring.application.name=cadastroclientes
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_SECRET_EXPIRATION_MS}

admin.default.email=${ADMIN_DEFAULT_EMAIL}
admin.default.senha=${ADMIN_DEFAULT_PASSOWRD}

n8n.webhook.url=${WEBHOOK_URL}
n8n.webhook.secret=${WEBHOOK_SECRET_KEY}
admin.notificacao.email=${ADMIN_NOTIFICACAO_EMAIL}