spring.application.name=cadastroclientes
spring.datasource.url=datasource_url
spring.datasource.username=datasource_username
spring.datasource.password=datasource_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=jwt_secret
jwt.expiration-ms=jwt_expiration-ms

admin.default.email=admin_default_email
admin.default.senha=admin_default_senha

n8n.webhook.url=n8n_webhook_url
n8n.webhook.secret=n8n_webhook_secret
admin.notificacao.email=admin_notificacao_email